<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wydarzenia – Kościół Charisma</title>
    <script>
      (function () {
        var p = location.pathname;
        var dir = p.endsWith("/") ? p : p.replace(/\/[^/]*$/, "") + "/";
        var b = document.createElement("base");
        b.href = dir;
        document.head.appendChild(b);
      })();
    </script>
    <link rel="stylesheet" href="style.css?v=23" />
  </head>
  <body>
    <div class="stage" id="stage">
    <main class="board" id="board">
      <header class="board__header">
        <h1 class="board__title" id="title">Ładowanie…</h1>
      </header>
      <ul class="events" id="events"></ul>
      <p class="board__empty" id="empty" hidden>Brak nadchodzących wydarzeń w ciągu najbliższych 8 dni.</p>
      <footer class="board__footer">
        <img class="board__qr" src="assets/qr.png?v=4" alt="Kod QR – subskrypcja iCal kalendarza" />
      </footer>
    </main>
    </div>
    <script src="app.js?v=9"></script>
  </body>
</html>
