name: Odśwież wydarzenia

on:
  schedule:
    # co 3 godziny (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - config.json
      - scripts/**
      - .github/workflows/update-calendar.yml

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Pobierz wydarzenia z Google Calendar
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: npm run fetch

      - name: Commit i push (jeśli są zmiany)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          git diff --staged --quiet || git commit -m "chore: odśwież wydarzenia kalendarza"
          git push
